experiment:
  name: main_multilabel
  description: Full RA-Layout multi-label layout defect detection experiment.
  task: multi_label_classification
  defect_types:
    - Overcrowding
    - Misalignment
    - Poor Visual Hierarchy

model:
  base_model: microsoft/layoutlmv3-base
  architecture: RA-Layout
  backbone: LayoutLMv3
  trainable_backbone_layers:
    - 8
    - 9
    - 10
    - 11
  use_ppl: true
  use_relation_aware_attention_bias: true
  use_handcrafted_geometry: true
  use_ocr_tokens: true
  classification_heads: independent_task_heads
  heads:
    - head_overcrowd
    - head_misalign
    - head_hierarchy

ppl:
  bbox_encoder_input_dim: 8
  spatial_transformer_layers: 2
  semantic_transformer_layers: 1
  relation_vector_dim: 11
  pooling:
    - max
    - mean
    - std
  task_specific_gating: true

data:
  dataset: OwlEye-LD
  train_path: data/processed/owleye_ld/train.json
  validation_path: data/processed/owleye_ld/validation.json
  test_path: data/processed/owleye_ld/test.json
  split: fixed_train_validation_test
  calibration_data: train_only
  max_length: 512

labels:
  type: continuous_soft_labels
  label_dimensions:
    - Overcrowding
    - Misalignment
    - Poor Visual Hierarchy
  binarization_threshold_for_metrics: 0.5
  heuristic_thresholds:
    coverage: train_set_75th_percentile
    nearest_neighbor_distance: train_set_25th_percentile
    hierarchy_defect: train_set_75th_percentile
    misalignment_score: train_set_75th_percentile

loss:
  function: BCEWithLogitsLoss
  positive_weights:
    - 1.0
    - 1.0
    - 1.0
  confidence_mask:
    enabled: true
    excluded_range: [0.45, 0.55]
    rule: exclude labels where 0.45 <= soft_label <= 0.55

training:
  seed: 42
  num_train_epochs: 30
  train_batch_size: 16
  eval_batch_size: 16
  learning_rates:
    layoutlmv3_last_four_layers: 2.0e-5
    perception_layer: 1.0e-4
    classification_heads: 1.0e-4
  optimizer: AdamW
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  fp16: true
  save_strategy: "no"

evaluation:
  threshold: 0.5
  metrics:
    - AUC
    - Precision
    - Recall
    - F1
    - Macro-F1
    - Macro-AUC
  report_splits:
    - validation
    - test

output:
  output_dir: layoutlmv3_multi_label_main

experiment:
  name: binary_overall_defect_detection
  description: Binary auxiliary experiment for detecting whether a UI screenshot is defective.
  task: binary_classification
  classes:
    - Normal
    - Defective

label_definition:
  source_labels:
    - Overcrowding
    - Misalignment
    - Poor Visual Hierarchy
  binary_rule: Defective if any of the three defect scores is >= 0.5; otherwise Normal.
  positive_label: Defective
  negative_label: Normal

model:
  base_model: microsoft/layoutlmv3-base
  architecture: RA-Layout binary variant
  backbone: LayoutLMv3
  trainable_backbone_layers:
    - 8
    - 9
    - 10
    - 11
  use_ppl: true
  use_relation_aware_attention_bias: true
  use_handcrafted_geometry: true
  use_ocr_tokens: true
  classification_head: binary_head
  output_dim: 1

ppl:
  bbox_encoder_input_dim: 8
  spatial_transformer_layers: 2
  semantic_transformer_layers: 1
  relation_vector_dim: 11
  pooling:
    - max
    - mean
    - std
  task_specific_gating: true

data:
  dataset: OwlEye-LD
  train_path: data/processed/owleye_ld/train.json
  validation_path: data/processed/owleye_ld/validation.json
  test_path: data/processed/owleye_ld/test.json
  split: fixed_train_validation_test
  calibration_data: train_only
  max_length: 512

loss:
  function: BCEWithLogitsLoss
  confidence_mask:
    enabled: false
    reason: Binary labels are hard labels, so ambiguous soft-label masking is not used.
  use_pos_weight: true
  bias_factor: 1.0

training:
  seed: 42
  num_train_epochs: 30
  report_every: 3
  train_batch_size: 16
  eval_batch_size: 16
  learning_rates:
    layoutlmv3_last_four_layers: 2.0e-5
    perception_layer: 1.0e-4
    binary_head: 1.0e-4
  optimizer: AdamW
  weight_decay: 0.01
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  fp16: true
  save_strategy: "no"

evaluation:
  threshold: 0.5
  metrics:
    - AUC
    - AUPRC
    - Precision
    - Recall
    - F1
    - Balanced Accuracy
    - MCC
    - Accuracy
  report_splits:
    - validation
    - test

output:
  output_root: full_model_binary_results
  metrics_csv: full_model_binary_metrics_every3epochs.csv
  final_test_csv: full_model_binary_epoch30_test_summary.csv
